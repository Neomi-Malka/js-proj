<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מעבדת האחוזים - כניסה</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page login-layout"> <div class="main-glass login-card">
        <h1>🧪 מעבדת האחוזים</h1>
        <form id="login-form">
            <input type="text" id="username" class="styled-input" placeholder="הכנס שם משתמש" required>
            
            <select id="difficulty" class="styled-input">
                <option value="1">רמה 1 - מתחילים</option>
                <option value="2">רמה 2 - מתקדמים</option>
            </select>

            <div class="button-group">
                <button type="submit" class="start-btn">התחל משחק</button>
                <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                    <a href="pages/instructions.html" class="info-btn" style="text-decoration:none; text-align:center; line-height:40px;">הוראות</a>
                    <a href="pages/leaderboard.html" class="leaderboard-btn" style="text-decoration:none; text-align:center; line-height:40px;">שיאים</a>
                </div>
            </div>
        </form>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
