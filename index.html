<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מלך האחוזים - כניסה</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="./styles/game.css">
</head>
<body class="game-page login-layout">
    <div class="login-card main-glass">
        <h1>מלך האחוזים 🧪</h1>
        <p>ברוכים הבאים למעבדה הלאומית לאחוזים!</p>
        
        <input type="text" id="username-input" placeholder="הכנס שם שחקן..." class="styled-input">
        
        <div class="level-selector">
            <p>בחר רמת קושי:</p>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="level" value="1" checked> רמת מתחילים (א')
                </label>
                <label class="radio-label">
                    <input type="radio" name="level" value="2"> רמת מתקדמים (ב')
                </label>
            </div>
        </div>

        <div class="button-group">
            <!-- כפתור התחלה -->
            <button onclick="startGame()" class="start-btn">התחל במחקר! 🚀</button>
            
            <!-- כפתור הוראות -->
            <button onclick="location.href='pages/instructions.html'" class="info-btn">איך משחקים? 🔬</button>
            
            <!-- כפתור שיאים (הוחזר למסך) -->
            <button onclick="location.href='pages/leaderboard.html'" class="leaderboard-btn">טבלת שיאים 🏆</button>
        </div>
    </div>

    <script>
        /**
         * @function startGame
         * @description שומר נתונים ועובר למסך המשחק
         */
        const startGame = () => {
            const nameField = document.getElementById('username-input');
            const name = nameField.value.trim() || "אורח";
            const level = document.querySelector('input[name="level"]:checked').value;
            
            localStorage.setItem('currentPlayer', JSON.stringify({ 
                name: name, 
                level: parseInt(level),
                date: new Date().toLocaleDateString()
            }));
            
            window.location.href = 'pages/game.html?level=' + level;
        };
    </script>
</body>
</html>
