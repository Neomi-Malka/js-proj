<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>המעבדה - משחק</title>
    <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
    <header class="game-header">
        <div class="header-item">שחקן: <span id="display-username"></span></div>
        <div class="header-item">זמן: <span id="timer">15</span></div>
        <div class="header-item">ניקוד: <span id="score">0</span></div>
    </header>

    <div class="main-glass story-card">
        <p id="story-text">טוען שאלה...</p>
    </div>

    <div id="main-drop-target" class="empty-slot">
        <span>גרור לכאן</span>
    </div>

    <div class="options-area">
        <div id="tubes-options" class="options-row"></div>
        <div id="buttons-options" class="options-row"></div>
    </div>

    <div id="finish-screen" class="hidden-overlay">
        <div class="main-glass login-card">
            <h2>סיום רמה! 🏆</h2>
            <p>כל הכבוד, סיימת את השלב.</p>
            <div class="star">⭐</div>
            <br>
            <a href="../index.html" class="start-btn">חזרה לתפריט</a>
        </div>
    </div>

    <audio id="sound-success" src="../audio/success.mp3" preload="auto"></audio>
    <audio id="sound-fail" src="../audio/fail.mp3" preload="auto"></audio>

    <script src="../js/game.js"></script>
</body>
</html>
