<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מלך האחוזים - המשחק</title>
    <link rel="stylesheet" href="../styles/game.css">
</head>
<body class="game-page">
    <div class="game-header">
        <div class="header-item" id="user-display">שחקן: </div>
        <div class="header-item" id="timer-display">זמן: ⏳</div>
        <div class="header-item" id="score-display">ניקוד: 0 🏆</div>
    </div>

    <div class="story-card main-glass" id="question-text">
        טוען שאלה...
    </div>

    <div class="empty-slot" id="main-drop-target" ondrop="drop(event)" ondragover="allowDrop(event)">
        <span>גרור לכאן</span>
    </div>

    <div class="options-area">
        <div id="tube-row" class="options-row"></div>
        <div id="buttons-options" class="options-row"></div>
    </div>

    <!-- קבצי שמע - שימי לב לנתיב המדויק עם S גדולה -->
    <audio id="sound-success" src="../Sounds/success.mp3"></audio>
    <audio id="sound-fail" src="../Sounds/fail.mp3"></audio>

    <script src="../scripts/game.js"></script>
</body>
</html>
